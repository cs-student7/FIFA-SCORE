{% extends "base.html" %}
{% block title %}Sign In – LEAGUE PLUS{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:420px">
  <div class="section-block p-4">
    <h1 class="section-title mb-4"><i class="bi bi-person-circle me-2"></i>Sign In</h1>

    {% if form.errors %}
    <div class="alert alert-danger py-2" role="alert">
      Invalid username or password.
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn gp-btn-primary w-100">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
